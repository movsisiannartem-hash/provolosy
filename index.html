<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5f4734">
    <title>ProВолосы, студия волос в Воронеже</title>
    <meta name="description" content="Студия волос ProВолосы в Воронеже.">
    <link rel="preload" href="assets/fonts/cormorant-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="stage">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="ProВолосы, главная">
          <img src="assets/wordmark.webp" alt="" width="540" height="102">
        </a>

        <button class="menu-toggle menu-icon" type="button" aria-controls="mobile-menu" aria-haspopup="dialog" aria-expanded="false" aria-label="Открыть меню">
          <span></span><span></span><span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Основная навигация">
          <ul>
            <li><button type="button" popovertarget="section-notice" popovertargetaction="show">О студии</button></li>
            <li><button type="button" popovertarget="section-notice" popovertargetaction="show">Услуги</button></li>
            <li><button type="button" popovertarget="section-notice" popovertargetaction="show">Обучение</button></li>
            <li><button type="button" popovertarget="section-notice" popovertargetaction="show">Работы</button></li>
            <li><button type="button" popovertarget="section-notice" popovertargetaction="show">Контакты</button></li>
          </ul>
        </nav>

        <a class="booking header-booking" href="tel:+79964504847">Записаться</a>
      </header>

      <main class="hero">
        <picture class="stage-photo" aria-hidden="true">
          <source media="(max-width: 60rem) and (orientation: portrait)" srcset="assets/hero-portrait.webp">
          <img src="assets/hero.webp" alt="" width="1816" height="866" fetchpriority="high">
        </picture>

        <h1>У волос свой <span class="hero-accent">характер.</span></h1>
        <div class="hero-actions">
          <a class="booking" href="tel:+79964504847">Записаться</a>
          <button class="works-action" type="button" popovertarget="section-notice" popovertargetaction="show">
            Смотреть работы
            <svg width="19" height="12" viewBox="0 0 19 12" fill="none" aria-hidden="true">
              <path d="M1 6h16m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </main>
    </div>

    <dialog class="mobile-menu" id="mobile-menu" aria-label="Меню">
      <div class="menu-header">
        <img class="menu-wordmark" src="assets/wordmark.webp" alt="ProВолосы" width="540" height="102">
        <button class="menu-close menu-icon" type="button" aria-label="Закрыть меню" autofocus>
          <span></span><span></span><span></span>
        </button>
      </div>
      <div class="menu-panel">
        <div class="menu-content">
          <div class="menu-links"></div>
          <div class="menu-footer">
            <a class="booking" href="tel:+79964504847">Записаться</a>
          </div>
        </div>
      </div>
    </dialog>

    <aside class="section-notice" id="section-notice" popover aria-labelledby="notice-label">
      <p id="notice-label" role="status">Блок в разработке</p>
      <a class="booking notice-booking" href="tel:+79964504847" aria-describedby="notice-label" autofocus>Записаться</a>
      <button class="close-button notice-close" type="button" popovertarget="section-notice" popovertargetaction="hide" aria-label="Закрыть сообщение"></button>
    </aside>

    <script src="site.js" defer></script>
  </body>
</html>
